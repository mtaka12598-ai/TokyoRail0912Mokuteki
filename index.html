</div>

const map=new maplibregl.Map({
 container:'map',style:'https://tiles.openfreemap.org/styles/liberty',
 center:[139.75,35.69],zoom:10.6,pitch:0,bearing:0,maxPitch:0
});
map.addControl(new maplibregl.NavigationControl(),'top-right');

function recolorBaseMap(){
 const layers=map.getStyle().layers||[];
 for(const layer of layers){
  const id=(layer.id||'').toLowerCase(), sl=(layer['source-layer']||'').toLowerCase();
  try{
   if(layer.type==='background') map.setPaintProperty(layer.id,'background-color','#F6F6F6');
   if((id.includes('water')||sl.includes('water'))&&layer.type==='fill'){map.setPaintProperty(layer.id,'fill-color','#87CEEB');map.setPaintProperty(layer.id,'fill-opacity',1)}
   if((id.includes('water')||sl.includes('water'))&&layer.type==='line') map.setPaintProperty(layer.id,'line-color','#87CEEB');
   if((id.includes('park')||id.includes('grass')||id.includes('green')||id.includes('wood')||id.includes('forest')||id.includes('cemetery')||sl.includes('park'))&&layer.type==='fill'){map.setPaintProperty(layer.id,'fill-color','#C5EED3');map.setPaintProperty(layer.id,'fill-opacity',1)}
   if((id.includes('residential')||id.includes('landuse-residential')||id.includes('suburb')||id.includes('building')||id.includes('commercial')||id.includes('industrial')||id.includes('retail')||id.includes('urban')||id.includes('landuse'))&&layer.type==='fill'){map.setPaintProperty(layer.id,'fill-color','#F6F6F6');map.setPaintProperty(layer.id,'fill-opacity',1);try{map.setPaintProperty(layer.id,'fill-outline-color','#E4E8EA')}catch(e){}}
   if((id.includes('road')||id.includes('motorway')||id.includes('trunk')||id.includes('street')||sl.includes('transportation'))&&layer.type==='line') map.setPaintProperty(layer.id,'line-color','#D5DFE3');
  }catch(e){}
 }
}

map.on('load',()=>{
 recolorBaseMap();
 for(const layer of map.getStyle().layers||[]) if(layer.type==='fill-extrusion') try{map.setLayoutProperty(layer.id,'visibility','none')}catch(e){}

 const holder=document.getElementById('groups');
 let gi=0;
 for(const [group,items] of Object.entries(groups)){
  const sec=document.createElement('section');
  sec.innerHTML=`<div class="grouphead"><h2>${group}</h2><div class="btns"><button data-on="${group}">全ON</button><button data-off="${group}">全OFF</button></div></div><div id="g${gi}"></div>`;
  holder.appendChild(sec);
  const list=sec.querySelector('#g'+gi);
  items.forEach((r,j)=>{
   const sid=`src-${gi}-${j}`, lid=`rail-${gi}-${j}`;
   map.addSource(sid,{type:'geojson',data:{type:'Feature',properties:{name:r.name},geometry:r.geometry}});
   map.addLayer({id:lid,type:'line',source:sid,paint:{'line-color':r.color,'line-width':4.5,'line-opacity':0.92}});
   const lab=document.createElement('label');lab.className='row';
   const routeKey=`${group}::${r.name}`;
   lab.innerHTML=`<input type="checkbox" checked data-layer="${lid}" data-group="${group}" data-routekey="${routeKey}"><span class="sw" style="background:${r.color}"></span><span>${r.name}</span>`;
   list.appendChild(lab);
  });
  gi++;
 }

 holder.addEventListener('change',e=>{

 // ---- 全駅マーカー：完全密着リング方式 ----
 map.addSource('all-stations',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 for(let i=7;i>=0;i--){
   map.addLayer({id:`station-solid-ring-${i}`,type:'circle',source:'all-stations',
     filter:['all',['==',['get','featureType'],'ring'],['==',['get','ringIndex'],i]],
     paint:{'circle-radius':['get','radius'],'circle-color':['get','color'],'circle-stroke-width':0,'circle-opacity':1}});
 }
 map.addLayer({id:'station-centers',type:'circle',source:'all-stations',
   filter:['==',['get','featureType'],'center'],
   paint:{'circle-radius':['get','radius'],'circle-color':['get','centerColor'],'circle-stroke-width':0,'circle-opacity':0.98}});

 function activeRouteKeys(){
   return new Set([...document.querySelectorAll('input[data-routekey]:checked')].map(x=>x.dataset.routekey));
 }
 function refreshStationMarkers(){
   const active=activeRouteKeys(),features=[];
   for(const st of allStationMarkers){
     const on=st.routes.filter(r=>active.has(r.key));
     if(!on.length) continue;
     let anchor=on[0].coord;
     if(on.length>1){
       let best=Infinity;
       for(const cand of on){
         let score=0;
         for(const other of on) score+=Math.hypot((cand.coord[0]-other.coord[0])*0.82,cand.coord[1]-other.coord[1]);
         if(score<best){best=score;anchor=cand.coord;}
       }
     }
     const pink=st.kind==='pink', cr=pink?7.5:5.625, rw=pink?2.05:1.7;
     on.forEach((r,idx)=>features.push({type:'Feature',
       properties:{featureType:'ring',name:st.name,ringIndex:idx,color:r.color,radius:cr+rw*(idx+1)},
       geometry:{type:'Point',coordinates:anchor}}));
     features.push({type:'Feature',
       properties:{featureType:'center',name:st.name,centerColor:pink?'#F7C6D2':'#6699ff',radius:cr},
       geometry:{type:'Point',coordinates:anchor}});
   }
   map.getSource('all-stations').setData({type:'FeatureCollection',features});
 }
 refreshStationMarkers();
 holder.addEventListener('change',e=>{if(e.target.closest('input[data-layer]'))refreshStationMarkers();});
 holder.addEventListener('click',e=>{if(e.target.dataset.on||e.target.dataset.off)setTimeout(refreshStationMarkers,0);});
 document.getElementById('allRoutesOff').addEventListener('click',()=>setTimeout(refreshStationMarkers,0));

 map.addSource('green-places',{type:'geojson',data:{type:'FeatureCollection',features:greenPlaces.map(p=>({
   type:'Feature',properties:{name:p.name},geometry:{type:'Point',coordinates:p.coord}
 }))}});
 map.addLayer({id:'green-places-layer',type:'circle',source:'green-places',
   paint:{'circle-radius':4.5,'circle-color':'#288c66','circle-stroke-width':0,'circle-opacity':1}});
 document.getElementById('greenPlaceToggle').addEventListener('change',e=>{
   map.setLayoutProperty('green-places-layer','visibility',e.target.checked?'visible':'none');
 });

 function openNamePopup(coord,name){
   if(window.currentPlacePopup)window.currentPlacePopup.remove();
   window.currentPlacePopup=new maplibregl.Popup().setLngLat(coord).setHTML(name).addTo(map);
 }
 map.on('click',e=>{
   const pad=22,box=[[e.point.x-pad,e.point.y-pad],[e.point.x+pad,e.point.y+pad]];
   const hits=map.queryRenderedFeatures(box,{layers:['green-places-layer','station-centers']});
   if(!hits.length)return;
   let best=hits[0],bd=Infinity;
   for(const f of hits){const p=map.project(f.geometry.coordinates),d=Math.hypot(p.x-e.point.x,p.y-e.point.y);if(d<bd){bd=d;best=f;}}
   openNamePopup(best.geometry.coordinates,best.properties.name);
 });
});

// ---- 地名・建物名検索（Nominatim / OpenStreetMap）----
let searchMarker = null;

async function runPlaceSearch(){
  const input = document.getElementById('placeSearchInput');
  const msg = document.getElementById('placeSearchMsg');
  const q = (input.value || '').trim();

  if(!q){
    msg.textContent = '検索する地名・建物名を入力してください。';
    return;
  }

  msg.textContent = '検索中…';

  try{
    const url = 'https://nominatim.openstreetmap.org/search'
      + '?format=jsonv2'
      + '&limit=1'
      + '&countrycodes=jp'
      + '&accept-language=ja'
      + '&q=' + encodeURIComponent(q);

    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    if(!data.length){
      msg.textContent = '見つかりませんでした。';
      return;
    }

    const item = data[0];
    const lng = parseFloat(item.lon);
    const lat = parseFloat(item.lat);

    map.flyTo({
      center:[lng,lat],
      zoom:16,
      essential:true
    });

    if(searchMarker) searchMarker.remove();

    const el = document.createElement('div');
    el.className = 'search-result-pin';

    searchMarker = new maplibregl.Marker({element:el})
      .setLngLat([lng,lat])
      .addTo(map);

    msg.textContent = item.display_name || q;
  }catch(err){
    console.error(err);
    msg.textContent = '検索に失敗しました。時間をおいて再度お試しください。';
  }
}

document.getElementById('placeSearchBtn').addEventListener('click', runPlaceSearch);
document.getElementById('placeSearchInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    runPlaceSearch();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && window.currentPlacePopup) {
    window.currentPlacePopup.remove();
    window.currentPlacePopup = null;
  }
});
